name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaster
          POSTGRES_PASSWORD: roaster
          POSTGRES_DB: assignment_roaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://roaster:roaster@localhost:5432/assignment_roaster_test
      # Enables tests/test_postgres_integration.py; it creates and resets its own roaster_pg_test DB.
      TEST_POSTGRES_URL: postgresql://roaster:roaster@localhost:5432/roaster_pg
      SECRET_KEY: ci-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: sk-test
      OPENAI_MODEL: gpt-4o
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: cp .env.example .env

      - name: Build images
        run: docker compose build
