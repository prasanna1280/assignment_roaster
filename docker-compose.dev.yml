# Standalone development stack with hot reload.
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roaster
      POSTGRES_PASSWORD: roaster
      POSTGRES_DB: assignment_roaster
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaster -d assignment_roaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://roaster:roaster@db:5432/assignment_roaster
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      FRONTEND_URL: http://localhost:5173
    entrypoint: ["sh", "-c"]
    command: ["alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data_dev:
