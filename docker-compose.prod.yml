# Production stack for a single VPS. HTTPS comes from a reverse proxy:
#
#  * Server already running Traefik (Docker provider, "websecure" entrypoint and a
#    "letsencrypt" cert resolver): the labels below route ${DOMAIN} to this app.
#      docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
#  * Fresh server with nothing on 80/443: also start the bundled Caddy.
#      docker compose -f docker-compose.prod.yml --env-file .env.production --profile caddy up -d --build
#
# No database/backend/frontend ports are published (Docker-published ports bypass ufw).
# Setup: cp deploy/production.env.example .env.production, then fill it in.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: assignment_roaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaster -d assignment_roaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://roaster:${POSTGRES_PASSWORD}@db:5432/assignment_roaster
      ENVIRONMENT: production
      FRONTEND_URL: https://${DOMAIN:?set DOMAIN in .env.production}
      BACKEND_URL: https://${DOMAIN}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    # Trust X-Forwarded-* from the proxy so client IPs (rate limits) and https are
    # correct. Safe because the backend is reachable only from the proxy.
    command: ["--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.roaster-api.rule: >-
        Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || Path(`/health`) || PathPrefix(`/docs`) || Path(`/openapi.json`))
      traefik.http.routers.roaster-api.priority: "100"
      traefik.http.routers.roaster-api.entrypoints: websecure
      traefik.http.routers.roaster-api.tls.certresolver: letsencrypt
      traefik.http.routers.roaster-api.middlewares: roaster-headers
      traefik.http.services.roaster-api.loadbalancer.server.port: "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin: the SPA calls /api/v1 on the same HTTPS domain.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      traefik.enable: "true"
      traefik.http.routers.roaster-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.roaster-web.priority: "1"
      traefik.http.routers.roaster-web.entrypoints: websecure
      traefik.http.routers.roaster-web.tls.certresolver: letsencrypt
      traefik.http.routers.roaster-web.middlewares: roaster-headers
      traefik.http.services.roaster-web.loadbalancer.server.port: "80"
      # Same security headers as deploy/Caddyfile.
      traefik.http.middlewares.roaster-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.roaster-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.roaster-headers.headers.frameDeny: "true"
      traefik.http.middlewares.roaster-headers.headers.referrerPolicy: strict-origin-when-cross-origin

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
